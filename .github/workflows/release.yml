name: Create release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Bundle files
        run: |
          mkdir -p ./temp/pulsar-properties
          rsync -a --exclude='.github/' ./ ./temp/pulsar-properties/
          cd ./temp && zip -r ../pulsar-properties.zip ./pulsar-properties

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "PULSAR-PROPERTIES ${{ github.ref_name }}"
          body: |
            ![Pulsar Framework](https://r2.fivemanage.com/GPYOH8Hq4GPyAY7czrgLe/pulsarbanner.png)

            ## PULSAR-PROPERTIES ${{ github.ref_name }}

            Property ownership and interior management system for Pulsar Framework.

            ### Installation
            1. Download `pulsar-properties.zip` below
            2. Extract into your server's `resources` folder
            3. Import `convert.sql` into your database
            4. Add `ensure pulsar-properties` to your `server.cfg`

            ---
            ![Pulsar Framework](https://img.shields.io/badge/Pulsar-Framework-7c3aed?style=flat-square)
            ![Built for FiveM](https://img.shields.io/badge/Built_for-FiveM-F40552?style=flat-square)
          files: pulsar-properties.zip
          prerelease: false
